name: Deploy Apps Script (clasp)

# Publica os fontes de src/ no projeto Apps Script a cada push na main.
# Secrets usados: CLASPRC_JSON (conteúdo do ~/.clasprc.json), SCRIPT_ID, DEPLOYMENT_ID (opcional).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: clasp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configurar credenciais do clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::Secrets CLASPRC_JSON e SCRIPT_ID são obrigatórios."; exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json','utf8'))" \
            || { echo "::error::CLASPRC_JSON não é um JSON válido."; exit 1; }

          # O formato do .clasprc.json depende da versão do clasp usada no login.
          if grep -q '"tokens"' "$HOME/.clasprc.json"; then
            echo "CLASP_PKG=@google/clasp@3" >> "$GITHUB_ENV"
          else
            echo "CLASP_PKG=@google/clasp@2.4.2" >> "$GITHUB_ENV"
          fi
          printf '{"scriptId":"%s","rootDir":"src"}\n' "$SCRIPT_ID" > .clasp.json

      - name: Instalar clasp
        run: npm install -g "$CLASP_PKG" && clasp --version

      - name: Garantir manifesto (appsscript.json)
        run: |
          set -euo pipefail
          # Se o repositório ainda não tem o manifesto, usa o que já está no projeto remoto,
          # preservando fuso, escopos e serviços avançados configurados lá.
          if [ ! -f src/appsscript.json ]; then
            mkdir -p /tmp/remoto
            printf '{"scriptId":"%s"}\n' "$(node -p "require('./.clasp.json').scriptId")" > /tmp/remoto/.clasp.json
            (cd /tmp/remoto && clasp pull)
            cp /tmp/remoto/appsscript.json src/appsscript.json
            echo "Manifesto copiado do projeto remoto:"
            cat src/appsscript.json
          fi

      - name: Validar sintaxe dos .gs
        run: |
          set -euo pipefail
          for f in src/*.gs; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" || { echo "::error file=$f::Erro de sintaxe"; exit 1; }
          done

      - name: Publicar (clasp push)
        run: |
          set -uo pipefail
          clasp --version
          clasp push -f 2>&1 | tee /tmp/push.log
          codigo=${PIPESTATUS[0]}
          # Algumas versões do clasp saem com 0 mesmo quando a API recusa o envio
          if [ "$codigo" -ne 0 ] || grep -qiE 'error|failed|denied|permission|invalid|not found|insufficient' /tmp/push.log; then
            # Causa real: linha da API (GaxiosError/mensagem), não o cabeçalho "Push failed" nem o stack trace
            causa=$(grep -vE '^\s+at |Push failed|Pushing files' /tmp/push.log | grep -iE 'error|exists|denied|permission|invalid|not found|insufficient' | head -1 | sed -E 's/^.*GaxiosError: *//')
            echo "::error title=clasp push recusado pelo Apps Script::${causa:-veja o log da etapa Publicar}"
            exit 1
          fi
          echo "::notice title=clasp push::$(grep -iE 'Pushed [0-9]+ files' /tmp/push.log | head -1)"

      - name: Conferir o que ficou no Apps Script
        run: |
          set -euo pipefail
          rm -rf /tmp/conferencia && mkdir -p /tmp/conferencia
          printf '{"scriptId":"%s"}\n' "$(node -p "require('./.clasp.json').scriptId")" > /tmp/conferencia/.clasp.json
          (cd /tmp/conferencia && clasp pull >/dev/null)
          for f in /tmp/conferencia/*.js; do [ -e "$f" ] && mv "$f" "${f%.js}.gs"; done
          echo "Arquivos no projeto remoto:"; ls -1 /tmp/conferencia | grep -v '^\.clasp' | sed 's/^/  - /'
          falhou=0
          for f in src/*; do
            n=$(basename "$f")
            if [ ! -f "/tmp/conferencia/$n" ]; then echo "::error::$n não está no Apps Script"; falhou=1;
            elif ! diff -q -B -w "$f" "/tmp/conferencia/$n" >/dev/null; then echo "::error::$n diferente no Apps Script"; falhou=1;
            else echo "  ✓ $n igual ao repositório"; fi
          done
          exit $falhou

      - name: Atualizar implantação
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYMENT_ID:-}" ]; then
            echo "DEPLOYMENT_ID não configurado - apenas o código foi publicado (suficiente para script vinculado à planilha)."
            exit 0
          fi
          clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub ${GITHUB_SHA::7} - $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Limpar credenciais
        if: always()
        run: rm -rf "$HOME/.clasprc.json" .clasp.json /tmp/remoto /tmp/conferencia
